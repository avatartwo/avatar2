# Build all images:
# $ docker-compose build
# Usage:
# $ docker-compose run -it avatar2-arm

x-common-options: &common-options
    command: /usr/bin/ipython3
    stdin_open: true
    tty: true
    privileged: true
    volumes:
        - /run/udev:/run/udev:ro
        - /dev/bus:/dev/bus:ro
        #- .:/workspace:rw
    entrypoint: []

x-avatar2-core: &avatar2-core
    image: avatartwo/avatar2-core
    build:
        dockerfile: avatar2-core.Dockerfile
        context: .

x-avatar2: &avatar2
    image: avatartwo/avatar2
    build:
        dockerfile: avatar2.Dockerfile
        context: .

#x-avatar2-panda: &avatar2-panda
#    image: avatartwo/avatar2-panda
#    build:
#        dockerfile: avatar2-panda.Dockerfile
#        context: .

 
services:

    avatar2-arm:
        <<: [*avatar2, *common-options]
        environment:
            AVATAR2_ARCH: ARM
            AVATAR2_GDB_EXECUTABLE: gdb-multiarch
            AVATAR2_QEMU_EXECUTABLE: qemu-system-arm

    avatar2-mips:
        <<: [*avatar2, *common-options]
        environment:
            AVATAR2_ARCH: MIPS
            AVATAR2_GDB_EXECUTABLE: gdb-multiarch
            AVATAR2_QEMU_EXECUTABLE: qemu-system-mips

    avatar2-i386:
        <<: [*avatar2, *common-options]
        environment:
            AVATAR2_ARCH: X86
            AVATAR2_GDB_EXECUTABLE: gdb-multiarch
            AVATAR2_QEMU_EXECUTABLE: qemu-system-i386

    avatar2-x86:
        <<: [*avatar2, *common-options]
        environment:
            AVATAR2_ARCH: X86
            AVATAR2_GDB_EXECUTABLE: gdb-multiarch
            AVATAR2_QEMU_EXECUTABLE: qemu-system-x86_64



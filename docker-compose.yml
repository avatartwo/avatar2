# Lightweight images without qemu
    avatar2-core-arm:
        <<: [*avatar2-core, *common-options]
        environment:
            AVATAR2_ARCH: ARM
            AVATAR2_GDB_EXECUTABLE: gdb-multiarch

    avatar2-core-mips:
        <<: [*avatar2-core, *common-options]
        environment:
            AVATAR2_ARCH: MIPS
            AVATAR2_GDB_EXECUTABLE: gdb-multiarch

    avatar2-core-i386:
        <<: [*avatar2-core, *common-options]
        environment:
            AVATAR2_ARCH: X86
            AVATAR2_GDB_EXECUTABLE: gdb-multiarch

    avatar2-core-x86:
        <<: [*avatar2-core, *common-options]
        environment:
            AVATAR2_ARCH: X86
            AVATAR2_GDB_EXECUTABLE: gdb-multiarch

# Tests
    tests-arm:
        <<: [*tests, *common-options]
        profiles: ["test"]
        depends_on:
          - avatar2-arm
        environment:
            AVATAR2_ARCH: ARM
            AVATAR2_GDB_EXECUTABLE: gdb-multiarch
            AVATAR2_QEMU_EXECUTABLE: qemu-system-arm
        command: python3 -m pytest /avatartwo/avatar2/tests -v

    tests-mips:
        <<: [*tests, *common-options]
        profiles: ["test"]
        depends_on:
          - avatar2-mips
        environment:
            AVATAR2_ARCH: MIPS
            AVATAR2_GDB_EXECUTABLE: gdb-multiarch
            AVATAR2_QEMU_EXECUTABLE: qemu-system-mips
        command: python3 -m pytest /avatartwo/avatar2/tests -v
